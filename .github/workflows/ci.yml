name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint
        continue-on-error: true  # ESLint config is advisory at this stage

      - name: Unit tests
        run: npm test -- --ci --forceExit
        env:
          AUTH_DISABLED: "true"

      - name: AI evaluation tests
        run: npm run test:eval -- --ci --forceExit
        env:
          AUTH_DISABLED: "true"

      - name: Build (production)
        run: npm run build
        env:
          AUTH_DISABLED: "true"
          AUTH_SECRET: "ci-secret-for-build-only"
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ""

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
          retention-days: 7

  preview:
    name: Vercel Preview Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel Preview
        id: deploy
        run: |
          npm i -g vercel --legacy-peer-deps
          URL=$(vercel --token=${{ secrets.VERCEL_TOKEN }} --yes 2>/dev/null | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        continue-on-error: true  # Non-blocking if Vercel token not configured
